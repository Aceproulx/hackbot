<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 260px;
    margin: 0;
    padding: 14px 16px;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: #202124;
    background: #fff;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 10px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #e8f5e9;
    border-radius: 6px;
    color: #1b5e20;
    font-weight: 500;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a73e8;
    flex-shrink: 0;
  }
  .desc {
    color: #5f6368;
    margin-top: 10px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <h1>Captcha Bridge</h1>
  <div class="status">
    <span class="dot"></span>
    <span>MCP-controlled mode</span>
  </div>
  <p class="desc">CAPTCHA clicks are triggered only via the MCP server using the <code>click_captcha</code> tool. No auto-clicking.</p>
</body>
</html>
